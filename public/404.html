<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111427">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>404: The Goose Ate This Page</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101326;color:#f7edcb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
h1{font-size:clamp(64px,18vw,160px);margin:0;letter-spacing:-.06em;color:#ffcf74;text-shadow:6px 7px #4c345b}
p{color:#c7c2d9;line-height:1.7;font-size:18px;max-width:420px;margin:12px auto 28px}
img{width:120px;image-rendering:pixelated;animation:chomp .5s steps(2) infinite}
@keyframes chomp{50%{transform:translateY(-6px) rotate(-6deg)}}
a{display:inline-block;background:#ffcf74;color:#1d1930;padding:15px 24px;border:3px solid #ffe6a7;box-shadow:5px 5px 0 #74466a;font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:13px;text-decoration:none}
@media(prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="A smug pixel goose">
  <h1>404</h1>
  <p>The goose ate this page. It is not sorry. It would do it again.</p>
  <a href="/">Back to safety</a>
</main>
</body>
</html>
