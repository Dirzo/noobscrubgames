<main id="viewport" aria-label="NoobScrub Games pixel-art arcade. Swipe horizontally to explore."><section id="world" aria-label="Pixel-art game studio lobby, with Siege of Legends, Andromedas, Crazy Weapon Man and Otis the dog">
<button class="hotspot hit-logo" aria-label="About NoobScrub Games" data-open="story"></button>
<button class="hotspot hit-siege" aria-label="Play Siege of Legends" data-open="play-siege"></button><button class="hotspot hit-andro" aria-label="Play Andromedas" data-open="play-andromedas"></button><button class="hotspot hit-cwm" aria-label="Play Crazy Weapon Man" data-open="play-cwm"></button><button class="hotspot hit-info1" aria-label="Learn about Siege of Legends" data-open="siege"></button><button class="hotspot hit-info2" aria-label="Learn about Andromedas" data-open="andromedas"></button><button class="hotspot hit-info3" aria-label="Learn about Crazy Weapon Man" data-open="cwm"></button><button class="hotspot hit-quiz" aria-label="Take the Noob or Scrub quiz" data-open="quiz"></button><button class="hotspot hit-patch" aria-label="Read patch notes" data-open="patch"></button><button class="hotspot hit-left" aria-label="Pan left" data-pan="-1"></button><button class="hotspot hit-right" aria-label="Pan right" data-pan="1"></button>
<button class="card-zoom siege" data-open="siege" aria-label="Preview Siege of Legends" data-x="2.3" data-y="29" data-w="31.2" data-h="45.2"></button><button class="card-zoom andro" data-open="andromedas" aria-label="Preview Andromedas" data-x="34.5" data-y="29" data-w="31.1" data-h="45.2"></button><button class="card-zoom cwm" data-open="cwm" aria-label="Preview Crazy Weapon Man" data-x="66.3" data-y="29" data-w="32.2" data-h="45.2"></button></section></main>

<div id="shade" role="presentation"><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title">THE ARCADE</h2><button id="close" aria-label="Close window">✕ CLOSE</button></header><div id="content"></div><footer><span>NOOBSCRUB GAMES • GAMES THAT DON'T SUCK • <a href="/privacy.html" style="color:inherit">PRIVACY</a></span><button id="back-to-games" hidden>← ALL GAMES</button></footer></section></div><div id="toast" role="status"></div>
<script>
(()=>{'use strict';

let soundOn=false,audioContext=null,lastHoverTone=0;
const soundButton=document.getElementById('sound-toggle');
function tone(frequency=420,duration=.055,type='sine',volume=.022){if(!soundOn)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,audioContext.currentTime);gain.gain.setValueAtTime(.0001,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(volume,audioContext.currentTime+.008);gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start();oscillator.stop(audioContext.currentTime+duration+.01)}catch(e){}}
soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.setAttribute('aria-label',soundOn?'Disable interactive sound effects':'Enable interactive sound effects');soundButton.textContent=soundOn?'♫ SOUND ON':'♫ SOUND OFF';tone(630,.065,'sine',.025)});
document.addEventListener('pointerover',e=>{if(!soundOn||!e.target.closest('.card-zoom,.hit-logo,.hit-quiz,.hit-patch'))return;const t=performance.now();if(t-lastHoverTone>210){lastHoverTone=t;tone(490,.038,'sine',.012)}});
document.addEventListener('click',e=>{if(e.target.closest('#sound-toggle'))return;if(e.target.closest('[data-open],[data-answer],[data-pan],#close,#back-to-games,.action'))tone(e.target.closest('[data-answer]')?660:420,.06,'triangle',.022)});

const games={siege:{name:'Siege of Legends',url:'https://manatorium.noobscrub.workers.dev/',genre:'Fantasy castle-defense auto-battler',description:'Draft a squad of unlikely champions, combine equipment and defend an evolving fortress. Face elemental horrors, relentless sieges, and the Eternal Goose. The odds are terrible. Your champions are worse. You might still win.'},andromedas:{name:'Andromedas',url:'https://andromedas.noobscrub.workers.dev/',genre:'Asteroid mining real-time strategy',description:'Survey mineral deposits and excavate a layered asteroid while rival crews race for its riches. Command humans, space fowl, cephalopods and reptilian Vessk, make branching tech choices and contest the final scraps of precious ore.'},cwm:{name:'Crazy Weapon Man',url:'https://crazyweaponman.noobscrub.workers.dev/',genre:'Ridiculous weapon-fueled action roguelike',description:'Fight mobs with impossible weapons, pick up loot, chain absurd upgrades and survive sprawling side-scrolling levels. Daggers, bows, hammers, staves, swords and shurikens: every run demands a new questionable weapon decision.'}};
function syncCards(){document.querySelectorAll('.card-zoom').forEach(el=>{let x=+el.dataset.x,y=+el.dataset.y,w=+el.dataset.w,h=+el.dataset.h;Object.assign(el.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});});}addEventListener('resize',syncCards);requestAnimationFrame(syncCards);
const shade=document.getElementById('shade'),content=document.getElementById('content'),title=document.getElementById('dialog-title'),back=document.getElementById('back-to-games'),viewport=document.getElementById('viewport');let previousFocus=null,quizIndex=0,quizScore=0;const questions=[{q:'You find a legendary sword that slowly insults you. What now?',a:['Equip it. Free motivation.','Check its stats, then equip it.','Sell it and buy twelve sticks.'],s:[0,2,1]},{q:'Your team is losing the final battle. Your move?',a:['Charge in alone while screaming.','Build a plan and coordinate a comeback.','Blame the healer (there is no healer).'],s:[0,2,1]},{q:'A glowing asteroid contains unknown minerals. You…',a:['Lick it to establish dominance.','Survey it, then set up extraction.','Sell the mining rig for a cooler hat.'],s:[0,2,1]},{q:'The goose boss has entered the arena.',a:['HONK BACK.','Study the attack patterns.','Offer it the castle deed.'],s:[0,2,1]},{q:'An upgrade gives +50% damage but -50% dignity.',a:['I never had dignity.','Compare the build synergy first.','Can I take it twice?'],s:[0,2,1]}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function open(key){previousFocus=document.activeElement;shade.classList.add('open');document.body.style.overflow='hidden';back.hidden=!(key.startsWith('play-')||games[key]);document.getElementById('dialog').classList.toggle('story-mode',key==='story');render(key);document.getElementById('close').focus();}
function render(key){if(key==='games'){title.textContent='CHOOSE YOUR CHAOS';content.innerHTML='<p>Three worlds. Absolutely zero respect for your free time.</p>'+Object.entries(games).map(([id,g])=>`<p><strong class="tag">${esc(g.name)}</strong> — ${esc(g.genre)}<br><button class="action" data-open="play-${id}">▶ PLAY IN THE ARCADE</button> <button class="action" data-open="${id}">ℹ DETAILS</button></p>`).join('');}
else if(key.startsWith('play-')){const id=key.slice(5),g=games[id];if(!g)return render('games');title.textContent='▶ '+g.name;content.innerHTML=`<p class="sr-only">${esc(g.description)}</p><iframe src="${esc(g.url)}" title="Play ${esc(g.name)}" loading="eager" allow="fullscreen; gamepad; autoplay" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="link-row"><a class="action" target="_blank" rel="noopener noreferrer" href="${esc(g.url)}">↗ OPEN GAME IN NEW TAB</a><button class="action" id="fullgame">⛶ FULLSCREEN</button></div><p style="font-size:12px;margin:0">If the game stays blank, its hosting security settings may prohibit embedding. Use “Open game in new tab” instead.</p>`;document.getElementById('fullgame').onclick=()=>content.querySelector('iframe').requestFullscreen?.();}
else if(games[key]){let g=games[key];title.textContent=g.name.toUpperCase();content.innerHTML=`<div class="preview-banner ${key}" role="img" aria-label="Pixel-art preview of ${esc(g.name)}"></div><h3>${esc(g.genre)}</h3><p>${esc(g.description)}</p><p>This is a playable, independently developed NoobScrub world. Controls and save behavior depend on each game's current build.</p><div class="link-row"><button class="action" data-open="play-${key}">▶ PLAY NOW</button></div>`;}
else if(key==='quiz'){title.textContent='NOOB OR SCRUB?';quizIndex=0;quizScore=0;renderQuestion();}
else if(key==='story'){title.textContent='WHO ARE WE?';content.innerHTML='<div class="studio-story"><div class="progress">WHO ARE WE?</div><h3>Proudly NoobScrub.</h3><p>We make games we want to play: systems worth mastering, worlds worth exploring, and enough chaos to keep every run interesting. More to come, probably with more geese.</p></div>';}
else if(key==='patch'){title.textContent='PATCH NOTES & STUDIO LOG';content.innerHTML='<h3>From the workbench</h3><p><strong>Siege of Legends:</strong> Expanding its elemental castles, champion drafts, evolving fortresses, and boss encounters.</p><p><strong>Andromedas:</strong> Asteroid resources, mining crews, technology paths, and multiplayer systems.</p><p><strong>Crazy Weapon Man:</strong> Evolving weapon variety, map progression, combat feel, and mobile controls.</p><p>These are development highlights, not dated release notes. The true patch notes are the enemies we knocked back along the way.</p>';}
else if(key==='community'){title.textContent='THE NOOBSCRUB COMMUNITY';content.innerHTML='<h3>Good games. Good people. Same bad ideas.</h3><p>Play a build, try the quiz, and tell us which hilarious disaster you caused. We are building our games in public-facing playable form and improving them a little at a time.</p><p>There is no official community server linked from this website yet. For now, share the games with someone who needs to lose an afternoon.</p>';}
else if(key==='contact'){title.textContent='CONTACT THE STUDIO';content.innerHTML='<h3>Send a raven. Or an email.</h3><p>For feedback, collaborations, or to report an especially suspicious goose, use our contact address once it is configured.</p><p><strong>Studio:</strong> NoobScrub Games</p><p><small>No email address is shown until a real mailbox is set up—imaginary inboxes are bad at responding.</small></p>';}
else render('games');}
function renderQuestion(){const q=questions[quizIndex];title.textContent='NOOB OR SCRUB?';content.innerHTML=`<div class="progress">QUESTION ${quizIndex+1} OF ${questions.length}</div><p class="question">${esc(q.q)}</p><div class="answers">${q.a.map((a,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>`;}
function choose(i){quizScore+=questions[quizIndex].s[i];quizIndex++;if(quizIndex<questions.length)return renderQuestion();const r=quizScore<=3?['CERTIFIED NOOB','You are not here to win. You are here to create legendary incident reports.']:quizScore>=8?['ELITE SCRUB','You min-max so hard the loading screen files a complaint.']:['THE NOOBSCRUB','Somehow brilliant, somehow terrible, and consistently entertaining.'];content.innerHTML=`<div class="progress">OFFICIAL RESULTS • DEFINITELY SCIENTIFIC</div><h3 style="font-size:2em">${r[0]}</h3><p>${r[1]}</p><p>Your chaos index: ${quizScore}/10.</p><div class="link-row"><button class="action" data-open="quiz">↻ RETAKE THE QUIZ</button><button class="action" id="share">⤴ COPY RESULT</button></div>`;document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(`I got ${r[0]} on the Noob or Scrub quiz at noobscrubgames.com. ${r[1]}`);toast('RESULT COPIED!')}catch{toast('COPY NOT AVAILABLE IN THIS BROWSER')}};}
function close(){shade.classList.remove('open');document.getElementById('dialog').classList.remove('story-mode');content.innerHTML='';back.hidden=true;previousFocus?.focus?.()}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-open],[data-answer],[data-pan]');if(target?.dataset.open){open(target.dataset.open)}else if(target?.dataset.answer!==undefined){choose(+target.dataset.answer)}else if(target?.dataset.pan){pan(+target.dataset.pan)}});document.getElementById('close').onclick=close;back.onclick=()=>{back.hidden=true;render('games')};shade.addEventListener('click',e=>{if(e.target===shade)close()});function pan(d){viewport.scrollBy({left:Math.max(170,innerWidth*.55)*d,behavior:'smooth'})}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&shade.classList.contains('open'))close();else if(!shade.classList.contains('open')&&e.key==='ArrowRight')pan(1);else if(!shade.classList.contains('open')&&e.key==='ArrowLeft')pan(-1);if(shade.classList.contains('open')&&e.key==='Tab'){const list=[...document.querySelectorAll('#dialog button,#dialog a[href]')].filter(x=>!x.hidden&&x.offsetParent!==null);let first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});})();
</script>
<script>
// Goose patrol: the honk counter releases geese that run along the castle cliff (top left of the painting).
(()=>{'use strict';
const world=document.getElementById('world'),btn=document.getElementById('honk-counter'),countEl=document.getElementById('honk-count');
const still=matchMedia('(prefers-reduced-motion:reduce)');
// Ground line in front of the castle, in % of the painting: [left, top] at each end.
const PATH=[[13.6,11.6],[33.4,18.4]],H=2.45,MAX=30;
let count=0,ctx=null;const geese=[];
try{count=parseInt(localStorage.getItem('honks'),10)||0}catch(e){}
function show(){countEl.textContent=count.toLocaleString();btn.setAttribute('aria-label',`Honk the goose. ${count} honks so far. Every honk releases another goose.`)}show();
function honkSound(pitch=1){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(420*pitch,now);o.frequency.exponentialRampToValueAtTime(250*pitch,now+.25);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.14,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.3);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.32)}catch(e){}}
function bubble(x,y,text){const b=document.createElement('div');b.className='runner-honk';b.textContent=text;b.style.left=x+'%';b.style.top=y+'%';world.appendChild(b);setTimeout(()=>b.remove(),900)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function spawn(){if(still.matches||geese.length>=MAX)return;const el=document.createElement('button'),rtl=Math.random()<.4;el.className='runner';el.type='button';el.tabIndex=-1;el.setAttribute('aria-hidden','true');el.innerHTML='<svg><use href="#goose"/></svg>';
const g={el,rtl,p:0,speed:1/(4.5+Math.random()*3.5),lane:(Math.random()-.5)*1.2,phase:Math.random()*6,honk:1+Math.random()*3,panic:0};
el.addEventListener('click',e=>{e.stopPropagation();g.panic=1.6;honk(true);bubble(pos(g)[0]+.8,pos(g)[1]-1,pick(['HONK!','HONK?!','HOOONK']))});
world.appendChild(el);geese.push(g)}
function pos(g){const t=g.rtl?1-g.p:g.p;return[PATH[0][0]+(PATH[1][0]-PATH[0][0])*t,PATH[0][1]+(PATH[1][1]-PATH[0][1])*t-H+g.lane]}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
for(let i=geese.length-1;i>=0;i--){const g=geese[i];g.p+=g.speed*dt*(g.panic>0?2.6:1);g.panic-=dt;g.honk-=dt;g.phase+=dt*(g.panic>0?30:18);
if(g.p>=1){g.el.remove();geese.splice(i,1);continue}
const[x,y]=pos(g);g.el.style.left=x+'%';g.el.style.top=y+'%';g.el.style.transform=`translateY(${-Math.abs(Math.sin(g.phase))*18}%) rotate(${Math.sin(g.phase)*6}deg) scaleX(${g.rtl?-1:1})`;
if(g.honk<=0){g.honk=2+Math.random()*4;if(Math.random()<.5)bubble(x+.8,y-1,pick(['HONK','honk','HONK!']))}}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function honk(fromGoose){count++;try{localStorage.setItem('honks',count)}catch(e){}show();honkSound(fromGoose?1.25:.9+Math.random()*.25);btn.classList.remove('bump');void btn.offsetWidth;btn.classList.add('bump')}
btn.addEventListener('click',()=>{honk(false);spawn()});
// A few geese are always on patrol, with more wandering through on their own.
for(let i=0;i<3;i++)setTimeout(spawn,400+i*1300);
(function wander(){setTimeout(()=>{if(!document.hidden&&geese.length<6)spawn();wander()},3500+Math.random()*5000)})();
})();
</script>
</body></html>
